[[component]]
# Device-owned component: the sources live in this repository at
# drivers/SdhciBlock/ and the macOS workflow appends this entry to the UniXNU
# components.toml checkout.  No repository/revision pin: the module is resolved
# from the device repository, exactly like the SoC source in feeds.toml.
id = "SdhciBlock"
kind = "driver"
function = "Unisoc UMS512 SDHCR11 eMMC block transport (userdata partition)"
scope = "storage"
hardware = ["Unisoc UMS512 SDHCR11 SDHCI 0x71400000", "8-bit non-removable eMMC, ADMA2"]
os_abi = ["ipados-17.7.11-21H461"]
board_dependencies = []
verified_devices = []
dependencies = []
source_files = ["NativeSdhciBlock.cpp"]
runtime_identifiers = ["NativeSdhciBlock", "NativeSdhciBlock.cpp"]
build_stage = "kernel"
# build-sdhci-block.py is device-owned (scripts/): it compiles the driver with
# the kernel's compile record and binds the IOStorageFamily imports to the
# addresses in drivers/SdhciBlock/storage-bindings.json, then archives both
# objects.  build-arm-driver.py cannot do that (it has no bindings step).
build = ["build-sdhci-block.py", "SdhciBlock"]
outputs = ["build/sdhciblock/libSdhciBlock.a"]
legacy_name = "NativeSdhciBlock"

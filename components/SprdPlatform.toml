[[component]]
id = "SprdPlatform"
kind = "driver"
function = "Factory 1h190 ADI/GPIO/I2C/input/battery/backlight and SC2355/Mali hardware bring-up"
scope = "board"
hardware = ["UMS512", "SC2730", "1h190 GPIO keys", "factory I2C touch candidates"]
os_abi = ["ipados-17.7.11-21H461"]
board_dependencies = []
verified_devices = []
dependencies = ["SprdInput"]
source_files = ["SprdPlatform.cpp", "SprdSdio.h", "SprdWcnPower.h", "SprdMali.h"]
runtime_identifiers = ["NativeSprdPlatform", "SprdPlatform.cpp"]
build_stage = "kernel"
build = ["build-arm-driver.py", "SprdPlatform"]
outputs = ["build/sprdplatform/libSprdPlatform.a"]
legacy_name = "NativeSprdPlatform"

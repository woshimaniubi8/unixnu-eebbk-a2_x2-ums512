[[component]]
id = "SprdPlatform"
kind = "driver"
function = "Factory 1h190 peripherals, SC2355 station and shared Bluetooth transport and Mali hardware bring-up"
scope = "board"
hardware = ["UMS512", "SC2730", "1h190 GPIO keys", "factory I2C touch candidates"]
os_abi = ["ipados-17.7.11-21H461"]
board_dependencies = []
verified_devices = []
dependencies = ["SprdInput"]
source_files = ["SprdPlatform.cpp", "SprdSdio.h", "SprdWcnPower.h", "SprdSdioDma.h", "SprdWcnPackets.h", "SprdWcnReceive.h", "SprdWcnStation.h", "SprdBluetoothStream.h", "SprdBluetoothTransport.c", "SprdBluetoothTransport.h", "NOTICE.BluetoothTransport", "SprdWcnScan.h", "SprdWcnApi.h", "SprdWcnSession.h", "SprdWcnCalibration.h", "SprdWcnCalibrationData.h", "SprdWcnBluetooth.h", "SprdWcnBluetoothData.h", "SprdWifiRuntime.cpp", "SprdWifiRuntime.h", "SprdWifiNet.cpp", "SprdWifiNetABI.h", "SprdMali.h", "SprdMaliTest.cpp", "firmware/wcnmodem-1h190-sc2355.bin", "firmware/wifi-conf-1h190.bin", "firmware/wifi-conf-1h190.json", "firmware/bluetooth-1h190.json", "mali/NativeMaliVm.cpp", "mali/NativeMaliMmu.cpp", "mali/NativeMaliGpuCore.cpp", "mali/NativeMaliJobSlot.cpp"]
runtime_identifiers = ["NativeSprdPlatform", "SprdPlatform.cpp"]
build_stage = "kernel"
build = ["build-sprd-platform.py"]
outputs = ["build/sprdplatform/libSprdPlatform.a"]
legacy_name = "NativeSprdPlatform"

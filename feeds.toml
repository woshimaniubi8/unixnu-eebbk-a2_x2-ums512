# Shared Unisoc UMS512 / SharkL5Pro SoC support.
#
# The SoC repository is embedded at soc/UniXNU-ums512-common so that CI and
# local builds are reproducible before a standalone UniXNU-ums512-common
# repository is published.  Once published, replace the local entry with:
#
#   [[source]]
#   name = "ums512"
#   kind = "soc"
#   git = "https://github.com/woshimaniubi8/UniXNU-ums512-common"
#   commit = "<40-character reviewed commit>"
#
[[source]]
name = "ums512"
kind = "soc"
local = "soc/UniXNU-ums512-common"

# The UMS512 patch series (soc:patches/xnu/series) is written against this XNU
# source tag: it is the tree hxzbaka/UniXNU-t610yp, the reference first-boot
# port for this SoC family, builds with.
[[source]]
name = "xnu"
kind = "refer"
git = "https://github.com/apple-oss-distributions/xnu.git"
ref = "xnu-8796.141.3"
commit = "1b191cb58250d0705d8a51287127505aa4bc0789"
darwin = "22.5.0"
version = "8796.141.3"
driverkit_tag = "xnu-8796.101.5"
trustcache_tag = "xnu-8796.101.5"
name: G52 Metal frontend build

on:
  workflow_dispatch:
    inputs:
      signature_only:
        description: Re-sign the pinned owned probe with 4 KiB hash pages
        type: boolean
        default: false
  workflow_call:
    inputs:
      signature_only:
        type: boolean
        default: false
      prepare_deployment:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  frontend:
    if: ${{ !inputs.signature_only && !inputs.prepare_deployment }}
    runs-on: macos-26
    timeout-minutes: 150
    env:
      JOBS: 4
      CCACHE_DIR: ${{ github.workspace }}/.mali-metal-ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      VIVA_CCACHE: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Fetch exact frontend and Mesa sources
        shell: bash
        run: |
          set -euo pipefail
          git init -q viva-gpu
          git -C viva-gpu remote add origin https://github.com/Nik300/viva-gpu.git
          git -C viva-gpu fetch -q --depth 1 origin 9ebe5e46f74f6d75fce1d76b2ea4ea603cb63637
          git -C viva-gpu checkout -q --detach FETCH_HEAD
          mkdir -p viva-gpu/mesa/src
          git -C viva-gpu/mesa/src init -q
          git -C viva-gpu/mesa/src remote add origin https://gitlab.freedesktop.org/mesa/mesa.git
          git -C viva-gpu/mesa/src fetch -q --depth 1 origin 8e87a503ebd91408c88596d1b9eeb5f4c0b2088d
          git -C viva-gpu/mesa/src checkout -q --detach FETCH_HEAD
          python3 device/scripts/prepare-mali-metal-source.py viva-gpu
      - name: Check the shipping NativeMali transport contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 device/scripts/run-mali-native-backend-tests.py viva-gpu
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang="$(xcrun --sdk iphoneos -f clang)"
          "$clang" -target arm64-apple-ios17.0 -isysroot "$sdk" -fobjc-arc -Wall -Wextra -Werror \
            -fsyntax-only viva-gpu/ios/native-metal-probe.m
      - name: Install upstream build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm spirv-llvm-translator spirv-tools zstd pkgconf ccache
          echo "BREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"
          echo "LLVM_PREFIX=$(brew --prefix llvm)" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcodebuild -downloadComponent metalToolchain
      - uses: actions/cache@v4
        with:
          path: .mali-metal-ccache
          key: mali-metal-g52-mesa2626-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: mali-metal-g52-mesa2626-${{ runner.arch }}-
      - name: Build upstream host compiler tools
        shell: bash
        run: |
          set -euo pipefail
          bash viva-gpu/mesa/build.sh macos-nosmoke 2>&1 | tee mesa-host.log
      - name: Build real iOS Panfrost frontend
        shell: bash
        run: |
          set -euo pipefail
          bash viva-gpu/ios/build.sh mesa 2>&1 | tee mesa-ios.log
          bash viva-gpu/ios/build.sh driver 2>&1 | tee metal-driver.log
          bash viva-gpu/ios/build.sh tests 2>&1 | tee metal-tests.log
      - name: Build signed owner Metal render qualification
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang="$(xcrun --sdk iphoneos -f clang)"
          "$clang" -target arm64-apple-ios17.0 -isysroot "$sdk" -fobjc-arc -O2 -Wall -Wextra -Werror \
            viva-gpu/ios/native-metal-probe.m -framework Foundation -framework Metal -framework IOSurface \
            -o viva-gpu/ios/out/tests/native-metal-probe
          xcrun --sdk iphoneos metal -target air64-apple-ios17.0 -c viva-gpu/ios/native-metal-probe.metal \
            -o viva-gpu/ios/out/tests/native-metal-probe.air
          xcrun --sdk iphoneos metallib viva-gpu/ios/out/tests/native-metal-probe.air \
            -o viva-gpu/ios/out/tests/native-metal-probe.metallib
          codesign -s - -f --pagesize 4096 --identifier native-metal-probe-5555494489c159357fe23e76b7d9b3b59930e92b --entitlements viva-gpu/ios/native-metal-probe.entitlements \
            viva-gpu/ios/out/tests/native-metal-probe
          codesign -d --entitlements :- viva-gpu/ios/out/tests/native-metal-probe \
            > native-metal-entitlements.plist 2> native-metal-signature.txt
      - name: Verify bundle format and signing
        shell: bash
        run: |
          set -euo pipefail
          python3 device/scripts/prepare-mali-metal-deployment.py . --fresh-build
          bundle=viva-gpu/ios/out/VivaMTLDriver.bundle
          file "$bundle/VivaMTLDriver"
          lipo "$bundle/VivaMTLDriver" -verify_arch arm64
          codesign --verify --strict --verbose=2 "$bundle"
          codesign -d --verbose=4 "$bundle" 2>signature.txt
          otool -L "$bundle/VivaMTLDriver" > dependencies.txt
          for test in vmprobe compute ca passbench native-metal-probe; do
            executable="viva-gpu/ios/out/tests/$test"
            test -s "$executable"
            lipo "$executable" -verify_arch arm64
            codesign --verify --strict "$executable"
          done
          git -C viva-gpu diff --binary > g52-frontend.patch
          python3 -c 'import hashlib,pathlib; b=pathlib.Path("viva-gpu/ios/out/VivaMTLDriver.bundle"); t=pathlib.Path("viva-gpu/ios/out/tests"); paths=[*b.rglob("*"),t/"native-metal-probe",t/"native-metal-probe.metallib",pathlib.Path("viva-gpu/g52-source-receipt.json")]; print("\n".join(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+str(p) for p in sorted(paths) if p.is_file()))' > SHA256SUMS
          echo 'NativeMali transport compiled; runtime Metal render and original IOSurface sharing remain qualification gates.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g52-metal-frontend
          path: |
            viva-gpu/ios/out/VivaMTLDriver.bundle/
            viva-gpu/ios/out/tests/
            viva-gpu/g52-source-receipt.json
            viva-gpu/COPYING*
            viva-gpu/LICENSE*
            *.log
            signature.txt
            native-metal-signature.txt
            native-metal-entitlements.plist
            dependencies.txt
            g52-frontend.patch
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  signature:
    if: ${{ inputs.signature_only || inputs.prepare_deployment }}
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
      - uses: actions/download-artifact@v4
        with:
          name: g52-metal-frontend
          run-id: ${{ inputs.prepare_deployment && 44772957799 || 44743450966 }}
          github-token: ${{ github.token }}
          path: frontend
      - name: Verify original bytes and re-sign only the owned probe
        run: python3 device/scripts/${{ inputs.prepare_deployment && 'prepare-mali-metal-deployment.py' || 'resign-mali-metal-probe.py' }} frontend
      - uses: actions/upload-artifact@v4
        with:
          name: g52-metal-frontend
          path: frontend/
          if-no-files-found: error
          retention-days: 7

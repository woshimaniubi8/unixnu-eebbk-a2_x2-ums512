name: macOS kernel + payload

# Builds the two Apple-derived layers on a macOS runner:
#   kernel  : XNU 10063.141.1 from apple-oss-distributions + UniXNU patch series,
#             prelinked against the iPadOS 17.7.11 (21H461) kernelcache
#   payload : FAT volume with kernel.macho + kernel.macho.adt + EFI/UniXNU/unixnu.toml
#
# Adapted from UniXNU's own .github/workflows/macos.yml (the only supported way to
# build the kernel: Xcode + macOS).  Apple-derived images are NOT uploaded by
# default; set upload_images=true on a manual dispatch to also get the payload
# artifact (your call: it contains Apple kernel/kernelcache-derived bytes).

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Steps to build
        type: choice
        options:
          - kernel
          - kernel payload
          - seed only
          - kernel payload metal
          - mali probe
          - mali metal
          - mali metal signature
          - mali metal deploy
          - mali metal trace
          - mali metal surface access
        default: kernel payload
      runner:
        description: Official GitHub macOS runner pool; all kernels/components explicitly target ARM64 regardless of host CPU
        type: choice
        options:
          - macos-26
          - macos-15
          - macos-26-intel
          - macos-15-intel
        default: macos-26
      xcode:
        description: Xcode version on the selected runner (/Applications/Xcode_<version>.app; Xcode 16.x rejects -Wno-unnecessary-virtual-specifier under -Werror)
        required: true
        default: "26.6"
      ipsw_url:
        description: IPSW URL (empty uses board.toml / OS profile)
        required: false
        default: ""
      unique_chip_id:
        description: Platform seed for the ADT (hex)
        required: true
        default: "0x554d533531325041"
      upload_images:
        description: Upload the payload artifact (Apple-derived; normally keep off)
        type: boolean
        default: false
      skip_bindings_check:
        description: Skip the SdhciBlock storage binding check (only for a run that derives a new table)
        type: boolean
        default: false
      refresh_bindings:
        description: Derive storage addresses from this link, rebuild, then require the normal binding guard
        type: boolean
        default: false
      data_seed:
        description: Build the writable APFS Data seed from the IPSW OS volume and put it in the payload
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  kernel:
    if: inputs.steps != 'mali probe' && inputs.steps != 'mali metal' && inputs.steps != 'mali metal signature' && inputs.steps != 'mali metal deploy' && inputs.steps != 'mali metal trace' && inputs.steps != 'mali metal surface access'
    name: XNU kernel + payload
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      UNIXNU_IPSW: ${{ inputs.ipsw_url }}
      UNIXNU_UNIQUE_CHIP_ID: ${{ inputs.unique_chip_id }}
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Clone UniXNU core
        run: |
          set -eux
          # Pin the core snapshot contemporaneous with the qualified M67 build;
          # unrelated upstream changes must not enter this platform-state repair.
          git init -q UniXNU
          git -C UniXNU remote add origin https://github.com/UniXNU/UniXNU.git
          git -C UniXNU fetch -q --depth 1 origin d8210e089792946841ca23a8ff39f3b3641b002f
          git -C UniXNU checkout -q --detach FETCH_HEAD
          git -C UniXNU rev-parse HEAD
          test -f UniXNU/scripts/unixnu/cli.py
          test -f UniXNU/package/UniXNUPkg/Application/UniXNU/UniXNU.inf
          # Upstream gitlinks occasionally name commits that the component
          # repository no longer advertises ("upload-pack: not our ref"), which
          # fails a recursive clone.  Initialise every submodule; when its
          # recorded commit is unavailable, fall back to the component's current
          # HEAD and record that commit in the module index so unixnu's own
          # `git submodule update --recursive` does not re-sync to the broken
          # pin.
          FALLBACKS=""
          for path in $(git -C UniXNU config --file .gitmodules --get-regexp '\.path$' | awk '{print $2}'); do
            case "$path" in
              drivers/ArmCpu) continue ;;
            esac
            if git -C UniXNU submodule update --init -- "$path"; then
              continue
            fi
            url=$(git -C UniXNU config --file .gitmodules --get "submodule.$path.url" || true)
            if [ -z "$url" ]; then
              url="https://github.com/UniXNU/$(basename "$path").git"
            fi
            echo "$path: recorded commit unavailable, using $url HEAD"
            rm -rf "UniXNU/$path"
            git clone -q "$url" "UniXNU/$path"
            FALLBACKS="$FALLBACKS $path"
          done
          # Native 16K bootstrap block mappings require congruent VA/PA
          # offsets inside 32 MiB, which is also valid for the old 4K kernel.
          git -C UniXNU/drivers/DarwinBoot apply --unidiff-zero "$GITHUB_WORKSPACE/device/patches/unixnu/darwinboot-16k-window-alignment.patch"
          python3 "$GITHUB_WORKSPACE/device/scripts/install-memory-handoff.py" UniXNU
          # ArmCpu keeps the commit this board was validated against.
          git clone -q https://github.com/UniXNU/ArmCpu.git UniXNU/drivers/ArmCpu
          git -C UniXNU/drivers/ArmCpu checkout -q 9066b53bbc82e92a98ec44a11dd50fd13eaf1a1b
          FALLBACKS="$FALLBACKS drivers/ArmCpu"
          git -C UniXNU add $FALLBACKS
          git -C UniXNU -c user.name=ci -c user.email=ci@localhost commit -q -m "ci: pin submodules whose recorded commits are gone"
          # The bootstrap pass links before the archive builders have produced
          # libmockfs_fixture.a and libSdhciBlock.a, so it must not reference
          # either the mockfs vfsops or the owner data mount (whose GPU addon
          # hook lives in the block transport archive).  Force both off for the
          # bootstrap only; the real build recompiles those objects and links
          # the archives as usual.
          python3 - <<'PY_PATCH'
          from pathlib import Path
          path = Path("UniXNU/scripts/unixnu/kernel.py")
          text = path.read_text()
          old = "subprocess_env = {**env, 'XNU_BOOT_PROGRESS': '0', 'XNU_BOOTSTRAP': '1'}"
          new = ("subprocess_env = {**env, 'XNU_BOOT_PROGRESS': '0', 'XNU_BOOTSTRAP': '1', "
                 "'XNU_SOURCE_MOCKFS': '0', 'XNU_OWNER_DATA_MOUNT': '0', "
                 "'XNU_OWNER_CACHE_MOUNT': '0', 'XNU_OWNER_CACHE_CARRIER': '0', "
                 "'XNU_OWNER_CACHE_STARTUP': '0', 'XNU_OWNER_BOOT_MANIFEST': '0', "
                 "'XNU_NATIVE_RAM_BLOCK': '0'}")
          if old not in text:
              raise SystemExit("kernel.py bootstrap environment not found")
          path.write_text(text.replace(old, new, 1))
          print("bootstrap pass forced to MOCKFS=0")
          PY_PATCH
          # Root-level /filesystems is not a hardware node, so the ADT builder
          # needs a dedicated serializer to keep Apple's vol.fs_* fstab fields.
          git -C UniXNU apply "$GITHUB_WORKSPACE/device/patches/unixnu/devicetree-filesystems.patch"
          # RamBlock's persistent-store hooks are weak imports upstream; XNU's
          # static link does not resolve them.  The device patch supplies the
          # volatile-disk stubs so the RAM Data seed can link.
          git -C UniXNU/drivers/RamBlock apply -p3 "$GITHUB_WORKSPACE/device/patches/unixnu/ramblock-link.patch"
          # mount_tmpfs (phase-2 ephemeral data) needs tmpfs registered.  The
          # stock kernelcache contains com.apple.filesystems.tmpfs, but the
          # curated prelink root list omits it; add it before the kernel build.
          python3 - <<'PY_TMPFS'
          from pathlib import Path
          path = Path("UniXNU/profiles/os/ipados-17.7.11-21H461/profile.toml")
          text = path.read_text()
          if '"com.apple.filesystems.tmpfs"' not in text:
              needle = '"com.apple.filesystems.apfs",'
              if needle not in text:
                  raise SystemExit("profile roots: apfs anchor not found")
              text = text.replace(needle, needle + ' "com.apple.filesystems.tmpfs",', 1)
              path.write_text(text)
          print("tmpfs added to prelink roots")
          PY_TMPFS
          # The watchdog ADT node carries timeout-sec; upstream's hardware
          # serializer only copies its U32 whitelist, so add the key.
          python3 - <<'PY_WDT'
          from pathlib import Path
          path = Path("UniXNU/scripts/unixnu/devicetree.py")
          text = path.read_text()
          if "'timeout-sec'" not in text:
              needle = "'timebase-frequency'"
              if needle not in text:
                  raise SystemExit("devicetree U32 anchor not found")
              path.write_text(text.replace(needle, "'timebase-frequency', 'timeout-sec'", 1))
          print("watchdog timeout-sec added to the ADT U32 whitelist")
          PY_WDT
          python3 - <<'PY_BT_DT'
          from pathlib import Path
          path = Path("UniXNU/scripts/unixnu/devicetree.py")
          text = path.read_text()
          needle = "U64 = {'redistributor-stride'}"
          if needle not in text:
              raise SystemExit("Bluetooth ADT U32 anchor missing")
          text = text.replace(needle, "U32 |= {'transport-encoding', 'speed'}\n" + needle, 1)
          path.write_text(text)
          PY_BT_DT
          # BBK display integration is pinned; never silently substitute another ABI.
          test "$(git -C UniXNU/drivers/GopFramebuffer rev-parse HEAD)" = b0d812d578efa2acb005b66f73168891719af09a
          git -C UniXNU/drivers/GopFramebuffer apply "$GITHUB_WORKSPACE/device/patches/unixnu/gop-bbk-cpu-only.patch"
          git -C UniXNU/drivers/GopFramebuffer apply "$GITHUB_WORKSPACE/device/patches/unixnu/gop-bbk-frame-timing.patch"
          git -C UniXNU/drivers/GopFramebuffer apply "$GITHUB_WORKSPACE/device/patches/unixnu/gop-bbk-mali-present.patch"
          git -C UniXNU/drivers/GopFramebuffer apply "$GITHUB_WORKSPACE/device/patches/unixnu/gop-bbk-plane-stride.patch"
          du -sh UniXNU

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install board components into the UniXNU checkout
        # The checkout above is upstream UniXNU, so the device-owned pieces have
        # to be injected before defconfig:
        #   * the SdhciBlock catalog entry (device/components/SdhciBlock.toml);
        #   * the ADT AAPL,phandle fix: upstream devicetree.py still emits a
        #     plain 'phandle', which XNU's IODTGetInterruptController cannot
        #     resolve (gIODTPHandleKey == 'AAPL,phandle'), so interrupt mapping
        #     would assert on the device tree the payload carries;
        #   * the offline owner cache-mount guard: upstream requires the Virtio
        #     block transport (XNU_NATIVE_VIRTIO_BLOCK) for XNU_OWNER_CACHE_MOUNT,
        #     but this board publishes the windows through the SDHCR11 transport,
        #     which provides the same owner verification hooks.  Accept
        #     XNU_NATIVE_SDHCI_BLOCK as the block transport that carries it.
        run: |
          set -eux
          printf '\n' >> UniXNU/components.toml
          cat device/components/SdhciBlock.toml >> UniXNU/components.toml
          printf '\n' >> UniXNU/components.toml
          cat device/components/SprdWatchdog.toml >> UniXNU/components.toml
          printf '\n' >> UniXNU/components.toml
          cat device/components/SprdThermal.toml >> UniXNU/components.toml
          printf '\n' >> UniXNU/components.toml
          cat device/components/SprdInput.toml >> UniXNU/components.toml
          printf '\n' >> UniXNU/components.toml
          cat device/components/SprdPlatform.toml >> UniXNU/components.toml
          printf '\n' >> UniXNU/components.toml
          cat device/components/A2KeyStoreState.toml >> UniXNU/components.toml
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          tomllib.loads(Path('UniXNU/components.toml').read_text())

          tree = Path('UniXNU/scripts/unixnu/devicetree.py')
          text = tree.read_text()
          anchor = "            properties.append((key, struct.pack('<I', entry.scalar(key))))"
          patched = ("            name = 'AAPL,phandle' if key == 'phandle' else key\n"
                     "            properties.append((name, struct.pack('<I', entry.scalar(key))))")
          if anchor in text:
              tree.write_text(text.replace(anchor, patched, 1))
          elif 'AAPL,phandle' not in text:
              raise SystemExit('devicetree.py: phandle anchor not found')

          build = Path('UniXNU/scripts/build-xnu-4k-baseline.sh')
          text = build.read_text()
          guard = 'if [ "$OWNER_CACHE_MOUNT" = 1 ] && [ "$OWNER_ROOT_TRUST" != 1 ]; then'
          relaxed = ('if [ "$OWNER_CACHE_MOUNT" = 1 ] && [ "$OWNER_ROOT_TRUST" != 1 ] && '
                     '[ "${XNU_NATIVE_SDHCI_BLOCK:-0}" != 1 ]; then')
          if guard in text:
              build.write_text(text.replace(guard, relaxed, 1))
          elif relaxed not in text:
              raise SystemExit('build-xnu-4k-baseline.sh: cache-mount guard not found')
          print('board components installed (owner cache mount accepts the SDHCI transport)')
          PY
          git -C UniXNU status --short

      - name: Select Xcode
        run: |
          set -eux
          preferred="/Applications/Xcode_${{ inputs.xcode }}.app"
          if [ -d "$preferred" ]; then
            chosen="$preferred"
          else
            chosen=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          test -n "$chosen"
          echo "DEVELOPER_DIR=$chosen/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected Xcode: $chosen"
          xcodebuild -version

      - name: Prepare native Mali userspace boot probe
        run: |
          set -euxo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p device/build/mali-user-probe
          xcrun clang++ -std=c++17 -target arm64-apple-ios17.0 -isysroot "$sdk" \
            -Wall -Wextra -Werror -F"$sdk/System/Library/PrivateFrameworks" \
            device/scripts/tools/mali-user-probe.cpp -framework CoreFoundation -framework IOKit \
            -Wl,-pagezero_size,0x100000000 -o device/build/mali-user-probe/mali-user-probe
          codesign --force --sign - --pagesize 4096 --identifier org.unixnu.bbk.mali-probe \
            --entitlements device/scripts/tools/mali-user-probe.entitlements.plist \
            device/build/mali-user-probe/
          python3 device/scripts/test-mali-probe-boot.py device/build/mali-user-probe/mali-user-probe
          python3 device/scripts/tests/test-mali-probe-trust.py
          python3 device/scripts/test-owner-data-scratch.py
          python3 device/scripts/test-mali-metal-launchd.py
          python3 device/scripts/prepare-mali-probe-boot.py \
            --probe device/build/mali-user-probe/mali-user-probe \
            --output device/patches/xnu/bbk-a2-mali-user-stage.patch \
            --report device/build/mali-user-probe/probe-stage.json
          printf '\nbbk-a2-mali-user-stage.patch\n' >> device/patches/xnu/series

      - name: Build the launchd service probe
        run: |
          mkdir -p device/build/service-probe
          xcrun clang -target arm64-apple-ios17.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -O2 -Wall -Wextra device/scripts/tools/service-probe.c -o device/build/service-probe/service-probe
          codesign -s - -f device/build/service-probe/service-probe
      - name: Check inputs
        run: |
          set -eux
          test -d "$DEVELOPER_DIR"
          test -f device/board.toml
          test -f device/configs/bbk-a2_defconfig
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h "$GITHUB_WORKSPACE"

      - name: Install host tools
        run: |
          set -eux
          brew install llvm lld mtools dtc
          command -v unifdef || brew install unifdef
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          clang --version | head -n 1
          ld.lld --version | head -n 1
          mformat --version 2>/dev/null | head -n 1 || true
          dtc --version

      - name: Qualify component warnings for the selected compiler
        run: |
          set -euxo pipefail
          python3 device/scripts/qualify-compiler-warnings.py UniXNU | tee compiler-qualification.json

      - name: Check SC2355 and Mali register transactions
        run: |
          set -euxo pipefail
          python3 device/scripts/generate-sprd-wifi-config.py device/drivers/SprdPlatform/firmware/wifi-conf-1h190.bin calibration-generated.h
          cmp device/drivers/SprdPlatform/SprdWcnCalibrationData.h calibration-generated.h
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer device/scripts/test-sprd-radio-gpu.cpp -o radio-gpu-host-test
          ./radio-gpu-host-test
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer device/scripts/test-sprd-wifi-scan.cpp -o wifi-scan-host-test
          ./wifi-scan-host-test
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer device/scripts/test-sprd-receive-budget.cpp -o receive-budget-host-test
          ./receive-budget-host-test
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer device/scripts/test-sprd-receive-tail.cpp -o receive-tail-host-test
          ./receive-tail-host-test
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer device/scripts/test-sprd-station.cpp -o station-host-test
          ./station-host-test
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer device/scripts/test-sprd-bt-stream.cpp -o bt-stream-host-test
          ./bt-stream-host-test
          for unit in bluetooth bt-session; do
            xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
              -fno-omit-frame-pointer "device/scripts/test-sprd-${unit}.cpp" -o "bt-${unit}-host-test"
            "./bt-${unit}-host-test"
          done

      - name: Check physical key and Home gesture reports
        run: |
          set -euxo pipefail
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer device/scripts/tests/test-sprd-home-button.cpp -o home-button-host-test
          ./home-button-host-test

      - name: Check framebuffer source bounds
        run: |
          set -euxo pipefail
          xcrun clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            UniXNU/drivers/GopFramebuffer/Test/request-state.c -o framebuffer-host-test
          ./framebuffer-host-test

      - name: Check native radio and Mali host contracts
        run: |
          set -euxo pipefail
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer device/scripts/tests/test-sprd-mali-job-routing.cpp \
            -o mali-job-routing-host-test
          ./mali-job-routing-host-test
          python3 device/scripts/generate-mali-render-packets.py --check
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer device/scripts/tests/test-sprd-mali-render.cpp -o mali-render-host-test
          ./mali-render-host-test mali-render-packets.bin
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer device/scripts/tests/test-sprd-mali-system.cpp \
            -o mali-system-host-test
          ./mali-system-host-test
          python3 device/scripts/check-mali-render-packets.py mali-render-packets.bin
          python3 device/scripts/mali-host/compute-payload.py
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer device/scripts/tests/test-sprd-mali-compute.cpp \
            -o mali-compute-host-test
          ./mali-compute-host-test
          python3 device/scripts/mali-host/compute-payload.py --present
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer device/scripts/tests/test-sprd-mali-present.cpp \
            -o mali-present-host-test
          ./mali-present-host-test
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer device/scripts/tests/test-sprd-mali-clock.cpp \
            -o mali-clock-host-test
          ./mali-clock-host-test
          python3 device/scripts/run-mali-session-tests.py
          for unit in vm job; do
            case "$unit" in vm) source=NativeMaliVm;; job) source=NativeMaliJob;; esac
            xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
              -fno-omit-frame-pointer -Idevice/scripts/mali-host/shim -Idevice/drivers/SprdPlatform/mali \
              "device/scripts/mali-host/test_${unit}.cpp" "device/drivers/SprdPlatform/mali/${source}.cpp" \
              -o "mali-host-${unit}"
            "./mali-host-${unit}"
          done

      - name: defconfig + status
        working-directory: UniXNU
        run: |
          set -eux
          ./unixnu defconfig bbk-a2_defconfig -D "$GITHUB_WORKSPACE/device"
          ./unixnu status -D "$GITHUB_WORKSPACE/device" | tee "$GITHUB_WORKSPACE/status.txt"

      - name: Build kernel
        if: inputs.steps != 'seed only'
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ./unixnu build kernel 2>&1 | tee "$GITHUB_WORKSPACE/kernel.log"

      - name: Verify original accelerator ABI and system Metal publication
        if: inputs.steps != 'seed only'
        working-directory: UniXNU
        run: |
          set -euxo pipefail
          KERNEL=$(ls out/*/*/*/kernel/kernel.macho | head -n 1)
          TREE="$(dirname "$(dirname "$KERNEL")")/tree"
          python3 "$GITHUB_WORKSPACE/device/scripts/check-mali-system-accelerator.py" \
            "$KERNEL" "$TREE/kits/XnuPrelink"
          python3 - "$TREE/build/sprdplatform/accelerator-abi.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report['initializer_deferred_until_iogpufamily_load']
          assert report['original_instructions_modified'] is False
          assert report['system_process_grants']==['backboardd','SpringBoard','WidgetRenderer_','WidgetRenderer_D']
          assert set(report['bindings'])=={
              '__ZN15IOAcceleratorESC2EPK11OSMetaClass',
              '__ZN15IOAcceleratorESD2Ev',
              '__ZN15IOAcceleratorES10gMetaClassE'}
          print('PASS: late IOAcceleratorES registration bindings and exact process grant list')
          PY

      - name: Rebuild with bindings derived from the current link
        if: ${{ inputs.refresh_bindings && inputs.steps != 'seed only' }}
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          KERNEL=$(ls out/*/*/*/kernel/kernel.macho | head -n 1)
          TREE="$(dirname "$(dirname "$KERNEL")")/tree"
          test -f "$KERNEL"
          test -d "$TREE/kits/XnuPrelink"
          cp "$KERNEL" "$KERNEL.binding-derivation"
          python3 "$GITHUB_WORKSPACE/device/scripts/rederive-sdhci-bindings.py" \
            "$KERNEL" "$GITHUB_WORKSPACE/device/drivers/SdhciBlock/storage-bindings.json" \
            "$TREE/kits/XnuPrelink"
          cp "$GITHUB_WORKSPACE/device/drivers/SdhciBlock/storage-bindings.json" "$GITHUB_WORKSPACE/storage-bindings.json"
          ./unixnu build kernel 2>&1 | tee "$GITHUB_WORKSPACE/kernel-rebound.log"

      - name: Check the SdhciBlock storage bindings against the kernel
        # The driver's IOStorageFamily imports are bound to absolute addresses
        # (drivers/SdhciBlock/storage-bindings.json) because IOStorageFamily is
        # not part of the kernel link.  LD_KERNEL_ARCHIVES participates in that
        # link, so changing the driver moves kernel symbols and makes the table
        # stale; fail here instead of publishing a kernel with bad dispatch slots.
        # A run with skip_bindings_check=true is the derivation run: it publishes
        # the kernel whose dispatch table the new storage-bindings.json comes from.
        if: ${{ !inputs.skip_bindings_check && inputs.steps != 'seed only' }}
        working-directory: UniXNU
        run: |
          set -euxo pipefail
          KERNEL=$(ls out/*/*/*/kernel/kernel.macho | head -n 1)
          test -f "$KERNEL"
          python3 "$GITHUB_WORKSPACE/device/scripts/check-sdhci-bindings.py" "$KERNEL" \
            "$GITHUB_WORKSPACE/device/drivers/SdhciBlock/storage-bindings.json"

      - name: Check original mobile display ABI and GOP archive
        if: inputs.steps != 'seed only'
        working-directory: UniXNU
        run: |
          set -euxo pipefail
          KERNEL=$(ls out/*/*/*/kernel/kernel.macho | head -n 1)
          python3 "$GITHUB_WORKSPACE/device/scripts/check-a2-gop-display.py" "$KERNEL" --prelink-tools kits/XnuPrelink

      - name: Apply BBK A2 bring-up kernel patches
        if: inputs.steps != 'seed only'
        working-directory: UniXNU
        run: |
          set -euxo pipefail
          KERNEL=$(ls out/*/*/*/kernel/kernel.macho | head -n 1)
          test -f "$KERNEL"
          python3 "$GITHUB_WORKSPACE/device/scripts/patch-bringup-kernel.py" "$KERNEL"
          # The offline Data seed is a plain unencrypted APFS volume.  Role=Data
          # makes APFS enforce the Data-volume encryption policy; NOP the exact
          # role/flag check in the prelinked APFS kext for this bring-up image.
          python3 "$GITHUB_WORKSPACE/device/scripts/patch-apfs-unencrypted-data.py" "$KERNEL"
          # Native ArmCpu owns this non-Apple platform. The original CPU
          # personality would wait for an Apple-only boot-CPU resource.
          python3 "$GITHUB_WORKSPACE/device/scripts/test-native-cpu-personality.py" "$KERNEL"
          python3 "$GITHUB_WORKSPACE/device/scripts/patch-native-cpu-personality.py" "$KERNEL"
          python3 "$GITHUB_WORKSPACE/device/scripts/check-thermal-abi.py" "$KERNEL"
          python3 "$GITHUB_WORKSPACE/device/scripts/check-sprd-input-abi.py" "$KERNEL" --prelink-tools kits/XnuPrelink
          python3 "$GITHUB_WORKSPACE/device/scripts/patch-hid-family-load.py" "$KERNEL" --prelink-tools kits/XnuPrelink

      - name: Verify final Mali system accelerator image
        if: inputs.steps != 'seed only'
        working-directory: UniXNU
        run: |
          set -euxo pipefail
          KERNEL=$(ls out/*/*/*/kernel/kernel.macho | head -n 1)
          TREE="$(dirname "$(dirname "$KERNEL")")/tree"
          python3 "$GITHUB_WORKSPACE/device/scripts/check-mali-system-accelerator.py" \
            "$KERNEL" "$TREE/kits/XnuPrelink"
          python3 - "$TREE/build/sprdplatform/accelerator-abi.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report['initializer_deferred_until_iogpufamily_load']
          assert report['original_instructions_modified'] is False
          assert report['system_process_grants']==['backboardd','SpringBoard','WidgetRenderer_','WidgetRenderer_D']
          assert set(report['bindings'])=={
              '__ZN15IOAcceleratorESC2EPK11OSMetaClass',
              '__ZN15IOAcceleratorESD2Ev',
              '__ZN15IOAcceleratorES10gMetaClassE'}
          print('PASS: final image retains late IOAcceleratorES registration and scoped grants')
          PY

      - name: Prepare the Data seed
        # The offline OS image has no writable Data volume: the OS window carries
        # only the read-only system volume.  The payload supplies the Data volume
        # as Payloads/scratch-data.img (ADT RAMDisk + ephemeral-storage), built
        # from the original OS volume's initial /private/var tree.  That needs
        # macOS hdiutil/diskutil (macos-26 runner) and the OS dmg from the pinned
        # IPSW (044-76040-038.dmg, [ipsw.sha256] pin); board.toml [payload]
        # size_mib has to fit kernel + ADT + 32 MiB seed (about 96 MiB).
        if: ${{ inputs.data_seed }}
        working-directory: UniXNU
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/device/scripts/test-trust-bundle.py"
          python3 "$GITHUB_WORKSPACE/device/scripts/prepare-data-seed.py" --tree "$PWD"

      - name: Fetch the qualified M220 kernel, ADT and GPU addon
        if: inputs.steps == 'seed only'
        run: |
          set -euxo pipefail
          mkdir -p m220
          cp "$GITHUB_WORKSPACE/device/seed-m220/payload.img" m220/payload.img

      - name: Stage the M220 kernel, ADT and GPU addon
        if: inputs.steps == 'seed only'
        working-directory: UniXNU
        run: |
          set -euxo pipefail
          img=$(find "$GITHUB_WORKSPACE/m220" -name payload.img -print -quit)
          test -n "$img"
          KERNEL_DIR=$(dirname "$(ls out/*/*/*/kernel/kernel.macho 2>/dev/null | head -n1)" 2>/dev/null || true)
          PAYLOAD_DIR=$(dirname "$(ls out/*/*/*/payload/payload.img 2>/dev/null | head -n1)" 2>/dev/null || true)
          if [ -z "$KERNEL_DIR" ] || [ "$KERNEL_DIR" = "." ]; then
            WORK=$(ls -d out/*/*/* | head -n1)
            KERNEL_DIR="$WORK/kernel"
            PAYLOAD_DIR="$WORK/payload"
          fi
          mkdir -p "$KERNEL_DIR" "$PAYLOAD_DIR"
          command -v mcopy >/dev/null || brew install mtools
          mcopy -o -i "$img" ::/EFI/UniXNU/Payloads/kernel.macho "$KERNEL_DIR/kernel.macho"
          mcopy -o -i "$img" ::/EFI/UniXNU/Payloads/kernel.macho.adt "$KERNEL_DIR/kernel.macho.adt"
          if mcopy -o -i "$img" ::/EFI/UniXNU/Payloads/kernel.macho.gpuaddon "$KERNEL_DIR/kernel.macho.gpuaddon"; then
            cp "$KERNEL_DIR/kernel.macho.gpuaddon" "$PAYLOAD_DIR/kernel.macho.gpuaddon"
          else
            echo "M220 payload has no separate kernel.macho.gpuaddon; keeping the qualified M220 kernel"
          fi
          cp "$KERNEL_DIR/kernel.macho.adt" "$PAYLOAD_DIR/kernel.macho.adt"

      - name: Build payload
        if: ${{ contains(inputs.steps, 'payload') || inputs.steps == 'seed only' }}
        working-directory: UniXNU
        run: |
          set -euxo pipefail
          # macOS ships bash 3.2, where expanding an empty array under `set -u`
          # fails; keep the optional argument in a plain string instead.
          if [ "${{ inputs.data_seed }}" != "true" ]; then
            # Derivation runs only need the kernel; the owner Data mount config
            # makes the payload step require a Data seed that is not built here.
            echo "derivation run: payload build skipped (no Data seed)" | tee "$GITHUB_WORKSPACE/payload.log"
            exit 0
          fi
          ./unixnu build payload --data-ramdisk build/owner-data-fixture/owner-data-32.cdr \
            --trust-cache build/owner-data-fixture/trustcache.bundle 2>&1 | tee "$GITHUB_WORKSPACE/payload.log"

      - name: Symbolize the boot UI trace
        if: always()
        continue-on-error: true
        run: |
          python3 device/scripts/symbolize-ui-trace.py

      - name: Stage the service probe with the payload
        run: |
          target=$(dirname "$(find UniXNU/out -name payload.img | head -n1)")
          cp device/build/service-probe/service-probe "$target/service-probe"
          ls -l "$target"

      - name: Report artifacts
        if: always()
        run: |
          set -eux
          # state.json does not record the work directory; the format-2 output is
          # out/<device>/<os_profile>/<config>/.
          WORK=$(ls -d UniXNU/out/*/*/* 2>/dev/null | head -n 1 || true)
          echo "work=$WORK" | tee -a "$GITHUB_ENV"
          {
            echo "## kernel/payload artifacts"
            echo '```'
            ls -l "$WORK/kernel" 2>/dev/null || true
            ls -l "$WORK/payload" 2>/dev/null || true
            echo '```'
            echo "## hashes"
            echo '```'
            sha256sum "$WORK"/kernel/*.macho "$WORK"/payload/payload.img 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the boot image would fit the 35 MiB boot partition
        if: ${{ always() && (contains(inputs.steps, 'payload') || inputs.steps == 'seed only') }}
        run: |
          set -eux
          WORK=$(ls -d UniXNU/out/*/*/* 2>/dev/null | head -n 1 || true)
          PAYLOAD="$WORK/payload/payload.img"
          if [ ! -f "$PAYLOAD" ]; then echo "no payload image (build failed before it)"; exit 0; fi
          PAYLOAD_BYTES=$(stat -f%z "$PAYLOAD")
          # boot.img = header + raw BootShim+FD (4,194,624) + payload ramdisk + DTB
          TOTAL=$((4202496 + PAYLOAD_BYTES))
          echo "payload=$PAYLOAD_BYTES boot.img_estimate=$TOTAL boot_partition=36700160" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -gt 36700160 ]; then
            echo "::warning::boot.img estimate $TOTAL exceeds the 35 MiB boot partition; repartition or shrink the payload"
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs
          path: |
            kernel.log
            kernel-rebound.log
            storage-bindings.json
            payload.log
            status.txt
            UniXNU/out/*/*/*/logs/*.log
            UniXNU/out/*/*/*/tree/build/sprdplatform/*-command.json
            UniXNU/out/*/*/*/tree/build/sprdplatform/accelerator-abi.json
            UniXNU/out/*/*/*/tree/build/sprdplatform/*.log
            UniXNU/build/owner-data-fixture/seed.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload payload image (Apple-derived)
        # boolean inputs compare as booleans, not strings; hashFiles is not
        # needed (if-no-files-found reports a missing payload instead).
        if: ${{ always() && inputs.upload_images }}
        uses: actions/upload-artifact@v4
        with:
          name: payload
          path: |
            UniXNU/out/*/*/*/payload/payload.img
            UniXNU/out/*/*/*/payload/payload.json
            UniXNU/out/*/*/*/kernel/kernel.macho
            storage-bindings.json
            UniXNU/build/owner-data-fixture/owner-data-32.cdr
            UniXNU/build/owner-data-fixture/trustcache.bundle
            UniXNU/build/owner-data-fixture/J120AP-Info.plist
            device/build/mali-user-probe/
            device/build/service-probe/
          if-no-files-found: error
          retention-days: 3

  mali_metal:
    if: inputs.steps == 'mali metal' || inputs.steps == 'mali metal signature' || inputs.steps == 'mali metal deploy' || inputs.steps == 'kernel payload metal'
    uses: ./.github/workflows/mali-metal.yml
    with:
      signature_only: ${{ inputs.steps == 'mali metal signature' }}
      prepare_deployment: ${{ inputs.steps == 'mali metal deploy' }}

  mali_probe:
    if: inputs.steps == 'mali probe'
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Compile original IOKit boundary probe
        run: |
          set -euxo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p out
          xcrun clang++ -std=c++17 -target arm64-apple-ios17.0 -isysroot "$sdk" \
            -Wall -Wextra -Werror -F"$sdk/System/Library/PrivateFrameworks" \
            scripts/tools/mali-user-probe.cpp -framework CoreFoundation -framework IOKit \
            -Wl,-pagezero_size,0x100000000 -o out/mali-user-probe
          codesign --force --sign - --pagesize 4096 --identifier org.unixnu.bbk.mali-probe \
            --entitlements scripts/tools/mali-user-probe.entitlements.plist out/mali-user-probe
          codesign --verify --strict --verbose=2 out/mali-user-probe
          codesign -d --verbose=4 out/mali-user-probe 2>out/signature.txt
          shasum -a 256 out/mali-user-probe | tee out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mali-user-probe
          path: out/

  mali_metal_trace:
    if: inputs.steps == 'mali metal trace'
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - uses: actions/download-artifact@v4
        with:
          name: g52-metal-frontend
          run-id: 44843873046
          github-token: ${{ github.token }}
          path: frontend
      - name: Build only the owned Metal stage probe
        run: python3 device/scripts/build-mali-metal-probe-trace.py frontend
      - uses: actions/upload-artifact@v4
        with:
          name: g52-metal-frontend
          path: frontend/
          if-no-files-found: error
          retention-days: 7

  mali_metal_surface_access:
    if: inputs.steps == 'mali metal surface access'
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
      - uses: actions/download-artifact@v4
        with:
          name: g52-metal-frontend
          run-id: 44838691910
          github-token: ${{ github.token }}
          path: frontend
      - name: Grant only the owned probe original IOSurface access
        run: python3 device/scripts/prepare-mali-metal-surface-access.py frontend
      - uses: actions/upload-artifact@v4
        with:
          name: g52-metal-frontend
          path: frontend/
          if-no-files-found: error
          retention-days: 7



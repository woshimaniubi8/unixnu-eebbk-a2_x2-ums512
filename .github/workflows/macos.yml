name: macOS kernel + payload

# Builds the two Apple-derived layers on a macOS runner:
#   kernel  : XNU 10063.141.1 from apple-oss-distributions + UniXNU patch series,
#             prelinked against the iPadOS 17.7.11 (21H461) kernelcache
#   payload : FAT volume with kernel.macho + kernel.macho.adt + EFI/UniXNU/unixnu.toml
#
# Adapted from UniXNU's own .github/workflows/macos.yml (the only supported way to
# build the kernel: Xcode + macOS).  Apple-derived images are NOT uploaded by
# default; set upload_images=true on a manual dispatch to also get the payload
# artifact (your call: it contains Apple kernel/kernelcache-derived bytes).

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Steps to build
        type: choice
        options:
          - kernel
          - kernel payload
        default: kernel payload
      runner:
        description: GitHub-hosted macOS runner image (macos-26 carries Xcode 26.6 / LLVM 21, macos-15 maxes at Xcode 26.3 / LLVM 17)
        type: choice
        options:
          - macos-26
          - macos-15
        default: macos-26
      xcode:
        description: Xcode version on the selected runner (/Applications/Xcode_<version>.app; Xcode 16.x rejects -Wno-unnecessary-virtual-specifier under -Werror)
        required: true
        default: "26.6"
      ipsw_url:
        description: IPSW URL (empty uses board.toml / OS profile)
        required: false
        default: ""
      unique_chip_id:
        description: Platform seed for the ADT (hex)
        required: true
        default: "0x554d533531325041"
      upload_images:
        description: Upload the payload artifact (Apple-derived; normally keep off)
        type: boolean
        default: false
      skip_bindings_check:
        description: Skip the SdhciBlock storage binding check (only for a run that derives a new table)
        type: boolean
        default: false
      data_seed:
        description: Build the writable APFS Data seed from the IPSW OS volume and put it in the payload
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  kernel:
    name: XNU kernel + payload
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      UNIXNU_IPSW: ${{ inputs.ipsw_url }}
      UNIXNU_UNIQUE_CHIP_ID: ${{ inputs.unique_chip_id }}
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Clone UniXNU core
        run: |
          set -eux
          git clone -q --depth 1 https://github.com/UniXNU/UniXNU.git UniXNU
          test -f UniXNU/scripts/unixnu/cli.py
          test -f UniXNU/package/UniXNUPkg/Application/UniXNU/UniXNU.inf
          # Upstream gitlinks occasionally name commits that the component
          # repository no longer advertises ("upload-pack: not our ref"), which
          # fails a recursive clone.  Initialise every submodule; when its
          # recorded commit is unavailable, fall back to the component's current
          # HEAD and record that commit in the module index so unixnu's own
          # `git submodule update --recursive` does not re-sync to the broken
          # pin.
          FALLBACKS=""
          for path in $(git -C UniXNU config --file .gitmodules --get-regexp '\.path$' | awk '{print $2}'); do
            case "$path" in
              drivers/ArmCpu) continue ;;
            esac
            if git -C UniXNU submodule update --init -- "$path"; then
              continue
            fi
            url=$(git -C UniXNU config --file .gitmodules --get "submodule.$path.url" || true)
            if [ -z "$url" ]; then
              url="https://github.com/UniXNU/$(basename "$path").git"
            fi
            echo "$path: recorded commit unavailable, using $url HEAD"
            rm -rf "UniXNU/$path"
            git clone -q "$url" "UniXNU/$path"
            FALLBACKS="$FALLBACKS $path"
          done
          # ArmCpu keeps the commit this board was validated against.
          git clone -q https://github.com/UniXNU/ArmCpu.git UniXNU/drivers/ArmCpu
          git -C UniXNU/drivers/ArmCpu checkout -q 9066b53bbc82e92a98ec44a11dd50fd13eaf1a1b
          FALLBACKS="$FALLBACKS drivers/ArmCpu"
          git -C UniXNU add $FALLBACKS
          git -C UniXNU -c user.name=ci -c user.email=ci@localhost commit -q -m "ci: pin submodules whose recorded commits are gone"
          # The bootstrap pass links before the archive builders have produced
          # libmockfs_fixture.a and libSdhciBlock.a, so it must not reference
          # either the mockfs vfsops or the owner data mount (whose GPU addon
          # hook lives in the block transport archive).  Force both off for the
          # bootstrap only; the real build recompiles those objects and links
          # the archives as usual.
          python3 - <<'PY_PATCH'
          from pathlib import Path
          path = Path("UniXNU/scripts/unixnu/kernel.py")
          text = path.read_text()
          old = "subprocess_env = {**env, 'XNU_BOOT_PROGRESS': '0', 'XNU_BOOTSTRAP': '1'}"
          new = ("subprocess_env = {**env, 'XNU_BOOT_PROGRESS': '0', 'XNU_BOOTSTRAP': '1', "
                 "'XNU_SOURCE_MOCKFS': '0', 'XNU_OWNER_DATA_MOUNT': '0', "
                 "'XNU_OWNER_CACHE_MOUNT': '0', 'XNU_OWNER_CACHE_CARRIER': '0', "
                 "'XNU_OWNER_CACHE_STARTUP': '0', 'XNU_OWNER_BOOT_MANIFEST': '0'}")
          if old not in text:
              raise SystemExit("kernel.py bootstrap environment not found")
          path.write_text(text.replace(old, new, 1))
          print("bootstrap pass forced to MOCKFS=0")
          PY_PATCH
          du -sh UniXNU

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install board components into the UniXNU checkout
        # The checkout above is upstream UniXNU, so the device-owned pieces have
        # to be injected before defconfig:
        #   * the SdhciBlock catalog entry (device/components/SdhciBlock.toml);
        #   * the ADT AAPL,phandle fix: upstream devicetree.py still emits a
        #     plain 'phandle', which XNU's IODTGetInterruptController cannot
        #     resolve (gIODTPHandleKey == 'AAPL,phandle'), so interrupt mapping
        #     would assert on the device tree the payload carries;
        #   * the offline owner cache-mount guard: upstream requires the Virtio
        #     block transport (XNU_NATIVE_VIRTIO_BLOCK) for XNU_OWNER_CACHE_MOUNT,
        #     but this board publishes the windows through the SDHCR11 transport,
        #     which provides the same owner verification hooks.  Accept
        #     XNU_NATIVE_SDHCI_BLOCK as the block transport that carries it.
        run: |
          set -eux
          printf '\n' >> UniXNU/components.toml
          cat device/components/SdhciBlock.toml >> UniXNU/components.toml
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          tomllib.loads(Path('UniXNU/components.toml').read_text())

          tree = Path('UniXNU/scripts/unixnu/devicetree.py')
          text = tree.read_text()
          anchor = "            properties.append((key, struct.pack('<I', entry.scalar(key))))"
          patched = ("            name = 'AAPL,phandle' if key == 'phandle' else key\n"
                     "            properties.append((name, struct.pack('<I', entry.scalar(key))))")
          if anchor in text:
              tree.write_text(text.replace(anchor, patched, 1))
          elif 'AAPL,phandle' not in text:
              raise SystemExit('devicetree.py: phandle anchor not found')

          build = Path('UniXNU/scripts/build-xnu-4k-baseline.sh')
          text = build.read_text()
          guard = 'if [ "$OWNER_CACHE_MOUNT" = 1 ] && [ "$OWNER_ROOT_TRUST" != 1 ]; then'
          relaxed = ('if [ "$OWNER_CACHE_MOUNT" = 1 ] && [ "$OWNER_ROOT_TRUST" != 1 ] && '
                     '[ "${XNU_NATIVE_SDHCI_BLOCK:-0}" != 1 ]; then')
          if guard in text:
              build.write_text(text.replace(guard, relaxed, 1))
          elif relaxed not in text:
              raise SystemExit('build-xnu-4k-baseline.sh: cache-mount guard not found')
          print('board components installed (owner cache mount accepts the SDHCI transport)')
          PY
          git -C UniXNU status --short

      - name: Select Xcode
        run: |
          set -eux
          preferred="/Applications/Xcode_${{ inputs.xcode }}.app"
          if [ -d "$preferred" ]; then
            chosen="$preferred"
          else
            chosen=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          test -n "$chosen"
          echo "DEVELOPER_DIR=$chosen/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected Xcode: $chosen"
          xcodebuild -version

      - name: Check inputs
        run: |
          set -eux
          test -d "$DEVELOPER_DIR"
          test -f device/board.toml
          test -f device/configs/bbk-a2_defconfig
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h "$GITHUB_WORKSPACE"

      - name: Install host tools
        run: |
          set -eux
          brew install llvm lld mtools dtc
          command -v unifdef || brew install unifdef
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          clang --version | head -n 1
          ld.lld --version | head -n 1
          mformat --version 2>/dev/null | head -n 1 || true
          dtc --version

      - name: defconfig + status
        working-directory: UniXNU
        run: |
          set -eux
          ./unixnu defconfig bbk-a2_defconfig -D "$GITHUB_WORKSPACE/device"
          ./unixnu status -D "$GITHUB_WORKSPACE/device" | tee "$GITHUB_WORKSPACE/status.txt"

      - name: Build kernel
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ./unixnu build kernel 2>&1 | tee "$GITHUB_WORKSPACE/kernel.log"

      - name: Check the SdhciBlock storage bindings against the kernel
        # The driver's IOStorageFamily imports are bound to absolute addresses
        # (drivers/SdhciBlock/storage-bindings.json) because IOStorageFamily is
        # not part of the kernel link.  LD_KERNEL_ARCHIVES participates in that
        # link, so changing the driver moves kernel symbols and makes the table
        # stale; fail here instead of publishing a kernel with bad dispatch slots.
        # A run with skip_bindings_check=true is the derivation run: it publishes
        # the kernel whose dispatch table the new storage-bindings.json comes from.
        if: ${{ !inputs.skip_bindings_check }}
        working-directory: UniXNU
        run: |
          set -euxo pipefail
          KERNEL=$(ls out/*/*/*/kernel/kernel.macho | head -n 1)
          test -f "$KERNEL"
          python3 "$GITHUB_WORKSPACE/device/scripts/check-sdhci-bindings.py" "$KERNEL" \
            "$GITHUB_WORKSPACE/device/drivers/SdhciBlock/storage-bindings.json"

      - name: Apply BBK A2 bring-up kernel patches
        working-directory: UniXNU
        run: |
          set -euxo pipefail
          KERNEL=$(ls out/*/*/*/kernel/kernel.macho | head -n 1)
          test -f "$KERNEL"
          python3 "$GITHUB_WORKSPACE/device/scripts/patch-bringup-kernel.py" "$KERNEL"

      - name: Prepare the Data seed
        # The offline OS image has no writable Data volume: the OS window carries
        # only the read-only system volume.  The payload supplies the Data volume
        # as Payloads/scratch-data.img (ADT RAMDisk + ephemeral-storage), built
        # from the original OS volume's initial /private/var tree.  That needs
        # macOS hdiutil/diskutil (macos-26 runner) and the OS dmg from the pinned
        # IPSW (044-76040-038.dmg, [ipsw.sha256] pin); board.toml [payload]
        # size_mib has to fit kernel + ADT + 32 MiB seed (about 96 MiB).
        if: ${{ inputs.data_seed }}
        working-directory: UniXNU
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/device/scripts/prepare-data-seed.py" --tree "$PWD"

      - name: Build payload
        if: contains(inputs.steps, 'payload')
        working-directory: UniXNU
        run: |
          set -euxo pipefail
          # macOS ships bash 3.2, where expanding an empty array under `set -u`
          # fails; keep the optional argument in a plain string instead.
          SEED=""
          if [ "${{ inputs.data_seed }}" = "true" ]; then
            SEED="--data-ramdisk build/owner-data-fixture/owner-data-32.cdr"
          fi
          ./unixnu build payload $SEED 2>&1 | tee "$GITHUB_WORKSPACE/payload.log"

      - name: Report artifacts
        if: always()
        run: |
          set -eux
          # state.json does not record the work directory; the format-2 output is
          # out/<device>/<os_profile>/<config>/.
          WORK=$(ls -d UniXNU/out/*/*/* 2>/dev/null | head -n 1 || true)
          echo "work=$WORK" | tee -a "$GITHUB_ENV"
          {
            echo "## kernel/payload artifacts"
            echo '```'
            ls -l "$WORK/kernel" 2>/dev/null || true
            ls -l "$WORK/payload" 2>/dev/null || true
            echo '```'
            echo "## hashes"
            echo '```'
            sha256sum "$WORK"/kernel/*.macho "$WORK"/payload/payload.img 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the boot image would fit the 35 MiB boot partition
        if: always() && contains(inputs.steps, 'payload')
        run: |
          set -eux
          WORK=$(ls -d UniXNU/out/*/*/* 2>/dev/null | head -n 1 || true)
          PAYLOAD="$WORK/payload/payload.img"
          if [ ! -f "$PAYLOAD" ]; then echo "no payload image (build failed before it)"; exit 0; fi
          PAYLOAD_BYTES=$(stat -f%z "$PAYLOAD")
          # boot.img = header + raw BootShim+FD (4,194,624) + payload ramdisk + DTB
          TOTAL=$((4202496 + PAYLOAD_BYTES))
          echo "payload=$PAYLOAD_BYTES boot.img_estimate=$TOTAL boot_partition=36700160" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -gt 36700160 ]; then
            echo "::warning::boot.img estimate $TOTAL exceeds the 35 MiB boot partition; repartition or shrink the payload"
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs
          path: |
            kernel.log
            payload.log
            status.txt
            UniXNU/out/*/*/*/logs/*.log
            UniXNU/build/owner-data-fixture/seed.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload payload image (Apple-derived)
        # boolean inputs compare as booleans, not strings; hashFiles is not
        # needed (if-no-files-found reports a missing payload instead).
        if: ${{ inputs.upload_images }}
        uses: actions/upload-artifact@v4
        with:
          name: payload
          path: |
            UniXNU/out/*/*/*/payload/payload.img
            UniXNU/out/*/*/*/payload/payload.json
            UniXNU/out/*/*/*/kernel/kernel.macho
          if-no-files-found: error
          retention-days: 3

name: runner probe

# Temporary diagnostic: which GitHub-hosted runner labels actually schedule for
# this repository?  Safe to delete once the macOS build path is known.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - run: uname -a
  macos14:
    runs-on: macos-14
    steps:
      - run: uname -a
  macos15:
    runs-on: macos-15
    steps:
      - run: uname -a
  macoslatest:
    runs-on: macos-latest
    steps:
      - run: uname -a

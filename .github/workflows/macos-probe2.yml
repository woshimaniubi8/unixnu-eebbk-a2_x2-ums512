name: macos probe 2

# Temporary diagnostic: which part of the macOS job definition keeps it queued?
on:
  workflow_dispatch:
    inputs:
      dummy:
        default: "x"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  exact:
    name: XNU kernel + payload
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      UNIXNU_IPSW: ${{ inputs.dummy }}
      UNIXNU_UNIQUE_CHIP_ID: "0x1"
    steps:
      - run: uname -a

  notimeout:
    name: no timeout
    runs-on: macos-latest
    env:
      UNIXNU_IPSW: ${{ inputs.dummy }}
      UNIXNU_UNIQUE_CHIP_ID: "0x1"
    steps:
      - run: uname -a

  noenv:
    name: no env
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - run: uname -a

  plain:
    name: plain
    runs-on: macos-latest
    steps:
      - run: uname -a

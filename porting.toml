schema_version = 1

[device]
name = "bbk-a2"
soc = "UMS512"
os_profile = "ipados-17.7.11-21H461"
summary = "BBK(EEBBK) A2/X2/X2P , ums512. Community port; no real-hardware result yet. This record separates what is proven from source (vendor firmware dumps, DTS, boot image headers) from what still needs a device."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".github/**", ".gitignore"]
inputs = ["Vendor partition dump A2&X2&X2P_Package/bak (boot.bin, vendor_boot.bin, dtbo.bin, uboot.bin, super.bin), TWRP device tree hxzbaka/twrp_device_eebbk_ums512_1h190-A2, UniXNU format-2 device template."]
configuration = ["board.soc = UMS512, board.soc_source = ums512, board.os_profile = ipados-17.7.11-21H461, schema_version = 2.", "config_fragments = arch common + soc:configs/ums512.config + os:configs/ipados.config; patch_series has the four standard roots.", "The SoC source is selected locally through local.toml ([[source]] kind=soc name=ums512) until soc/UniXNU-ums512-common is published."]
procedure = ["From the UniXNU core checkout: cp ../UniXNU-bbk-a2/local.toml.example ../UniXNU-bbk-a2/local.toml", "./unixnu defconfig bbk-a2_defconfig -D ../UniXNU-bbk-a2", "./unixnu status --json and ./unixnu tree; inspect the resolved SoC source, components and patch order."]
findings = ["The device is ums512_1h190: TWRP README says 'Android device tree for EEBBK X2 (ums512_1h190)' and the vendor boot.bin DTB is compatible 'sprd,ums512', model 'Unisoc UMS512 SoC'.", "Unisoc T610 is the marketing name of the UMS512/SharkL5Pro family; uboot.bin contains 'SHARKL5PRO'.", "The official device template requires schema_version = 2 and a 40-character SoC commit pin; the local override is recorded in local.toml and must be replaced by a published pin before release."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The SoC repository has no published commit yet, so feeds.toml keeps REPLACE_ME/REQUIRED_SOC_COMMIT and builds rely on local.toml.", "The os_profile is a placeholder until an IPSW identity is chosen for the DarwinBoot milestone."]
next_action = ["Publish soc/UniXNU-ums512-common, pin its commit, then re-run defconfig/status and record the resolved output."]
evidence = [{ kind = "source", reference = "board.toml", result = "Device identity, SoC source, defconfig, firmware and boot image parameters." }]

[[area]]
id = "firmware"
status = "host-verified"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "uefi/**", ".github/workflows/build.yml"]
inputs = ["Boot chain: BootROM -> FDL -> splloader -> U-Boot 2015.07 + cboot -> boot partition. Vendor uboot.bin strings: 'U-Boot 2015.07 (Nov 30 2022) SHARKL5PRO', 'bootcmd=cboot normal', 'fastboot', 'verifiedboot', 'avb'.", "EDK2 stack: microsoft/mu_basecore release/202608 (26bfddb2), mu_plus (566cf5c8), mu_oem_sample (9292f925), UniXNU/uefi-sheng sheng branch Silicon/Silicium (0eb4514d).", "UniXNU core checkout for UniXNUPkg and DarwinBootPkg, selected by BBK_A2_UNIXNU."]
configuration = ["firmware.config = bbk-a2; firmware.dsc = Platforms/Unisoc/bbkA2Pkg/bbkA2.dsc; firmware.fd = Build/bbkA2Pkg/{target}_CLANGDWARF/FV/SILICIUM_UEFI.fd.", "BootShim entry 0x80080000 (cboot kernel load address), FD_BASE 0x80800000, FD_SIZE 0x400000.", "Firmware DSC/FDF embed UniXNU.efi, UniXNUDxe, UniXNURamDiskDxe, DarwinBoot, DiskIoDxe and Fat; PcdBbkA2ResetAtEndOfDxe=FALSE so BDS reaches the UniXNU menu."]
procedure = ["CI: push to main runs .github/workflows/build.yml; the firmware job clones the pinned EDK2 deps plus UniXNU, builds BaseTools, runs uefi/build-bbk-a2.sh DEBUG and uploads the firmware artifact.", "Local: export BBK_A2_UNIXNU=<UniXNU checkout>; export BBK_A2_DEPS=<deps>; . uefi/env-linux.sh; make -C \/Source/C -j; sh uefi/build-bbk-a2.sh DEBUG."]
findings = ["Unisoc devices have no UEFI firmware; BootShim is the trampoline from the stock bootloader into EDK2. cboot loads the kernel field at 0x80080000 and passes x0 = merged FDT (static evidence: cboot image 0x1B2B0 mov x4,#0x80080000; 0x1DB10 mov x0,#0x82000000).", "ArmPkg timer defaults 29/30/27/26 do not match the vendor FDT (13/14/11/10) and leave DXE stuck on the first timer event; the platform DSC overrides PcdArmArchTimer*IntrNum.", "The stock U-Boot logobuffer is at 0x9e000000 (string 'logobuffer@9e000000'); SprdGopDxe publishes GOP over it instead of initialising DPU/DSI.", "GitHub Actions run 40338889538 builds the FD (4,194,304 B) with UniXNU.efi 126,976 B, UniXNUDxe 32,768 B, UniXNURamDiskDxe 36,864 B and DarwinBoot.efi 45,056 B in the FV; FVMAIN is auto-sized 99% and FVMAIN_COMPACT uses 13% of the 4 MiB FD."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["No real hardware: BootShim handoff address, FDT in x0, UART baud and framebuffer state are unverified for cboot on UMS512.", "An empty boot.img ramdisk means the UniXNU menu has no payload entries; a payload FAT (kernel.macho + .adt + unixnu.toml) needs a macOS XNU build."]
next_action = ["fastboot boot the CI boot.img artifact on hardware, capture UART1/ramoops, then record the first menu frame."]
evidence = [
  { kind = "host", command = "gh run view 40338889538 --repo woshimaniubi8/unixnu-eebbk-a2_x2-ums512", revision = "556f28af2a1b9f781cd7201ef4a1115ed7472181", reference = "https://github.com/woshimaniubi8/unixnu-eebbk-a2_x2-ums512/actions/runs/40338889538", result = "firmware/bootimg/selftest jobs green; the FD contains UniXNU.efi, UniXNUDxe, UniXNURamDiskDxe and DarwinBoot.efi" },
  { kind = "source", reference = "uefi/Platforms/Unisoc/bbkA2Pkg/bbkA2.dsc", result = "Platform DSC with the four UniXNU/DarwinBoot INFs and UniXNULib." },
]
[[area]]
id = "cpu"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu"]
paths = ["dts/**", "soc/UniXNU-ums512-common/dts/**", "soc/UniXNU-ums512-common/configs/**"]
inputs = ["Vendor DTB: cpus/cpu@0..700, 6x Cortex-A55 + 2x Cortex-A75, PSCI smc, GICv3 0x12000000/0x12040000 stride 0x20000, timer PPI 13/14/11/10, 26 MHz."]
configuration = ["soc dtsi exports GIC as unixnu,adt-name = intc with #interrupt-cells = 3 and redistributor-stride = <0 0x20000>.", "CPUs carry unixnu,cluster-type E (A55, cpu0-5) and P (A75, cpu6-7); MPIDR affinities 0x0..0x700.", "ums512.config enables CONFIG_XNU_ARM_DT_PLATFORM / ARMCPU / NATIVE_ARCH_TIMER / NATIVE_PAN."]
procedure = ["dtc -I dts -O dtb -i ../UniXNU-ums512-common/dts -o /tmp/bbk-a2.dtb ../UniXNU-bbk-a2/dts/bbk-a2.dts", "python3 scripts/make-adt.py --dtb /tmp/bbk-a2.dtb --os-profile profiles/os/ipados-17.7.11-21H461/profile.toml --board ../UniXNU-bbk-a2/board.toml --unique-chip-id <hex> --output /tmp/kernel.macho.adt"]
findings = ["The vendor FDT uses #interrupt-cells = 3 and timer flags 4 (level high); the SoC dtsi follows it.", "The A55 cluster is 6 cores and the A75 cluster 2 cores, unlike the E5 (8x A53); cluster-type values are per CPU, not per cluster index."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["No hardware run: SMP release and per-CPU entry are unverified."]
next_action = ["Compile the DTB and ADT on the host, then verify with the first serial log on hardware."]
evidence = [{ kind = "source", reference = "dts/bbk-a2.dts", result = "Board memory, reserved regions and board identity; SoC topology comes from the SoC dtsi." }]

[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "proprietary-files.txt", "uefi/**/MemoryMapLib/**"]
inputs = ["Vendor DTB memory { 0x80000000, 0x80000000 } (2 GiB) and reserved-memory: ddrbist 0x1000, rebootescrow 0x10000 @0x81ff0000, audio 0x300000 @0x87500000, sipc 0x800000 @0x87800000, sensorhub 0x1000000 @0x88000000, audiodsp 0x600000 @0x89000000, cp 0x4900000 @0x89600000, iq 0x4000000 @0x90000000, sml 0x40000 @0x94000000, tos 0x400000 @0x94040000, ramoops 0x40000 @0xfff80000, debug 0x1000 @0x100000000."]
configuration = ["board payload.adt.dram_size = 0x80000000; owned_memory_size = 0x10000000 (256 MiB, 2 MiB aligned).", "Reserved regions are documented in dts/bbk-a2.dts; the UEFI MemoryMapLib must mark them reserved so EDK2 never allocates over TEE/modem/DSP/ramoops."]
procedure = ["Compare vendor FDT reserved-memory with the EDK2 MemoryMapLib table before every firmware build."]
findings = ["TEE (tos-mem) and SML regions start at 0x94000000; the firmware volume at 0x80800000 and the UEFI stack at 0x80480000 are below them and do not overlap.", "The U-Boot logobuffer at 0x9e000000 is not in reserved-memory; it is a bootloader-owned allocation and must be reserved by the firmware/platform."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["Memory sizing beyond 2 GiB variants is unverified; A2/X2/X2P may ship different DRAM sizes."]
next_action = ["Read the actual memory size from a hardware unit or from the bootloader log before trusting the 2 GiB value."]
evidence = [{ kind = "source", reference = "dts/bbk-a2.dts", result = "Reserved-memory table extracted from the vendor DTB." }]

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["drivers/**", "scripts/*storage*", "scripts/*userdata*"]
inputs = ["Stock storage is eMMC HS400ES (SDHCI 0x71400000; fstab: /dev/block/by-name/*, mmcblk0boot0/1 for spl), dynamic partitions in super (system/system_ext/vendor/product, non-A/B).", "Partition list and sizes: boot 0x2300000 (35 MiB), recovery 0x2800000, vendor_boot 0x6400000, dtbo 0x800000, super 8.00 GiB (sparse dump expands to 0x200000000; the 0x12693F9E8 file size is the sparse file, not the partition), userdata (see flash/partitions.csv)."]
configuration = ["No storage component selected for the first milestone: the UniXNU payload arrives as the boot image ramdisk and is published by UniXNURamDiskDxe."]
procedure = ["First milestone: confirm the payload FAT volume appears through the initrd block device (UNIXNURAMDISK log).", "Later: add a native eMMC driver component and userdata windows (board.toml [userdata]) after repartitioning."]
findings = ["The boot partition is only 35 MiB, which caps the FAT payload; iOS kernel payloads need a larger boot partition (see the UniXNU documentation)."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Root: the configured volume mounts and launchd starts."]
limits = ["eMMC controller registers, PHY/clock programming and DMA attributes are not yet extracted from the vendor kernel."]
next_action = ["Extract the eMMC host controller programming sequence from the vendor kernel sources for ums512_1h190."]
evidence = []


[[area]]
id = "packaging"
status = "implemented"
components = ["SoftwareAES", "XnuPrelink"]
paths = ["configs/**", "patches/**", "package/**", "scripts/**", "board.toml"]
inputs = ["Vendor boot.bin header: ANDROID! v2, pagesize 2048, kernel_addr 0x8000, ramdisk_addr 0x5400000, cmdline console=ttyS1,115200n8 buildvariant=user.", "TWRP BoardConfig: BOARD_KERNEL_TAGS_OFFSET 0x100, BOARD_KERNEL_BASE 0, BOARD_BOOTIMG_HEADER_VERSION 2."]
configuration = ["board [bootimg.image]: base 0, kernel_offset 0x8000, ramdisk_offset 0x5400000, tags_offset 0x100, pagesize 2048, header_version 2.", "Payload FAT volume 8 MiB (boot partition limit 35 MiB); boot image for fastboot RAM boot during bring-up."]
procedure = ["./unixnu build payload (optional) and ./unixnu bootimg --uefi uefi --dtb <firmware.dtb> --ramdisk none", "python3 tools/verify-bootimg.py dist/boot.img (host-side structural verification)."]
findings = ["unixnu bootimg gzips BootShim+FD, appends the DTB and writes an Android header v2 image with the configured offsets; it verifies the round-trip itself.", "The vendor boot.img also carries a DTB and a recovery_dtbo section; our boot.img has an empty ramdisk and a single appended DTB, which is sufficient for the BootShim handoff."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["The XNU kernel/prelink step is not exercised in this workspace (needs Apple xnu sources and the payload kernel); only the BootShim+FD+DTB boot image path is built."]
next_action = ["Build the full payload with an XNU kernel once an OS profile/IPSW identity is selected."]
evidence = [{ kind = "host", command = "python3 tools/verify-bootimg.py dist/boot.img", reference = "tools/build-bootimg.sh", result = "Boot image header, gzip, FD size and DTB round-trip checks." }]


inputs = ["Vendor DTB: dpu@20300000, dsi@20400000, generic MIPI panel, Goodix gt9xx touch with touchscreen-size-x = 1200, touchscreen-size-y = 1920.", "U-Boot logobuffer at 0x9e000000."]
configuration = ["First milestone reuses the framebuffer left by the stock bootloader (GOP over 0x9e000000); DPU/DSI re-initialisation is deferred.", "panel resolution is expected to be 1200x1920 portrait (density 320 in the TWRP device tree)."]
procedure = ["Confirm GOP mode and framebuffer bytes on hardware (fill test), then hand the framebuffer to DarwinBoot."]
findings = ["Silicium SimpleFbDxe requires at least 640x475; 1200x1920 satisfies that, so the E5 custom GOP workaround is not needed if the bootloader framebuffer is usable."]

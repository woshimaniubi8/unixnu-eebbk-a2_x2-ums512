schema_version = 2

[board]
name = "bbk-a2"
soc = "UMS512"
soc_source = "ums512"
os_profile = "ipados-17.7.11-21H461"
kit = "bbk-a2"
description = "BBK(EEBBK) A2/X2/A2P"

[components]
# Minimal first-bring-up set, same shape as UniXNU-e5 (Unisoc UMS9621):
# device-tree platform expert + ARM CPU (GICv3 + architectural timer) + the
# payload/prelink tooling + the SDHCI eMMC transport that publishes the
# userdata partition (drivers/SdhciBlock, device-owned component registered by
# .github/workflows/macos.yml through components/SdhciBlock.toml).
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "SdhciBlock", "RamBlock", "SprdWatchdog", "SprdThermal"]

[kernel]
defconfig = "bbk-a2_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/ums512.config", "os:configs/ipados.config"]
# The OS profile series is intentionally replaced: its zzz-boot-progress.patch
# depends on the sheng (SM8550) XNU_SHENG_PMGR context and cannot apply to the
# Unisoc kernel.  The SoC-independent XnuPrelink patches it also carried are
# listed in the device series instead (patches/xnu/series).
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "device:patches/xnu/series"]
# The arch profile lists its component archives explicitly, and archive_plan()
# only auto-adds every selected component when no "component:" entry is
# present.  This list is the arch profile's list plus the device-owned SDHCI
# transport; the archive itself is force-loaded through
# CONFIG_XNU_EXTRA_LD_ARCHIVES in the defconfig.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "component:SdhciBlock",
  "component:SprdWatchdog",
  "component:SprdThermal",
  "component:RamBlock",
]

[device_tree]
source = "device:dts/bbk-a2.dts"
include_dirs = ["soc:dts"]

[firmware]
# uefi-bbk-a2 follows the Mu-Silicium repository layout that
# `./unixnu build firmware --uefi ../uefi-bbk-a2` and
# `./unixnu bootimg --uefi ../uefi-bbk-a2` expect:
#   BootShim/BootShim.S                 Unisoc cboot trampoline (0x80080000 -> FD_BASE)
#   Resources/Configs/bbk-a2.toml       [boot_shim] [uefi_fd] [boot_image_kernel] [boot_image]
#   Resources/Scripts/mkbootimg.py      Android boot image writer (from Mu-Silicium)
#   Platforms/Unisoc/bbkA2Pkg/          DSC/FDF + MemoryMapLib + UniXNU payload DXE
#   Silicon/Unisoc/UMS512Pkg/           SoC layer (UART, GIC, timer, DPU/GOP)
config = "bbk-a2"
dsc = "Platforms/Unisoc/bbkA2Pkg/bbkA2.dsc"
fd = "Build/bbkA2Pkg/{target}_CLANGDWARF/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Platforms/Unisoc",
  "{uefi}/Silicon/Unisoc",
  "{uefi}/Silicon/Silicium",
]

[firmware.defines]
DEVICE_MODEL = "bbk-a2"
ENABLE_SECUREBOOT = "0"

# Stock boot image parameters, read from the vendor boot.bin header:
#   header_version 2, pagesize 2048, kernel_addr 0x8000, ramdisk_addr 0x5400000
# plus the tags offset used by the EEBBK device tree (0x100).
# cboot relocates the kernel field to 0x80080000 regardless of kernel_addr;
# BootShim then copies the firmware volume to FD_BASE (0x80800000).
[bootimg.image]
base = 0x0
kernel_offset = 0x8000
ramdisk_offset = 0x5400000
tags_offset = 0x100
pagesize = 2048
header_version = 2

[payload]
# The boot partition is 35 MiB (0x2300000, measured from the whole-MiB dump
# length; the TWRP BoardConfig 40 MiB value carries a TODO and is wrong), so the
# FAT payload has to stay small for the first milestone.  Booting iOS needs the
# XNU kernel inside this volume; enlarge the boot partition (see
# docs/DUAL-BOOT.md) before that.
volume = "UNIXNU"
# The prelinked kernel.macho is ~49 MiB, so the FAT payload needs 52 MiB.
# That does NOT fit the 35 MiB boot partition next to the 4.2 MiB BootShim+
# firmware kernel field: the payload is a separate artifact for now and needs
# either a bigger boot partition (repartition) or a FAT partition delivered
# through userdata (see docs/DUAL-BOOT.md).
size_mib = 96
loader = "firmware"
title = "UniXNU BBK A2/X2"
dram_size = "0x100000000"
panic_screen = false
timeout = 0
kernel_args = ["debug=0x144", "serial=3", "amfi_get_out_of_my_way=1", "bbk-skip-rootauth=1", "sheng-gpu-addon=1", "gpu-addon=1", "-wdt_no_pmu"]
# Static + System trust cache bundle built from this IPSW's StaticTrustCache and
# Cryptex1,SystemTrustCache components (bundle format: <3I> header + modules).
# Without it AMFI falls back to the amfid daemon port and rejects launchd/dyld.
trust_cache_sha256 = ["92c94f555ef608531dec2c262af06e0703db8fd6ee443efa0ae366f94e87aaf7"]

[payload.adt]
# Format 2: the ADT is generated by scripts/make-adt.py from dts/bbk-a2.dts.
chip_id = "512"
unique_chip_id = "required"

# APFS SYSTEM volume UUID of the OS window in userdata-root.img
# (extracted from the iPadOS 17.7.11 restore image); XNU matches the
# IOMedia UUID through /chosen/root-matching.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
# launchd's mount-phase-1 builds /private/preboot/<boot-manifest-hash>/
# usr/standalone/firmware.  This is the hash the kernel publishes from the
# SHNGROOT manifest (SHA384 of the OwnerBootSet domain); the seed builder puts
# the original IPSW's Firmware/all_flash tree under the same directory.
preboot_manifest_hash = "0AF4F61D24CBA408AE4E1B88C69881A4776BB65F52F75B3196D1C5CFDDD0AAC36FCEEB34CD6521E6E641EC3AB1EA0454"
dram_size = "0x100000000"
owned_memory_size = "0x40000000"
psci_method = "smc"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"

[userdata]
# GPT entry measured on hardware (see the UEFI GPT walk in the bring-up log).
# The eMMC exposes 512-byte sectors and the GPT LBA unit is 512 bytes:
#   last_lba - first_lba + 1 = 0xD5C87DF sectors = 109456 MiB = 114,773,966,336 B
# and EXT_CSD SEC_COUNT (0xE8F8000) = last usable LBA + 34 backup-GPT sectors.
first_lba = 0x132F800
last_lba = 0xE8F7FDE
lba_bytes = 512
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

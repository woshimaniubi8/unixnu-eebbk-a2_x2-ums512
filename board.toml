schema_version = 2

[board]
name = "bbk-a2"
soc = "UMS512"
soc_source = "ums512"
os_profile = "ipados-17.7.11-21H461"
kit = "bbk-a2"
description = "BBK/EEBBK A2, X2 and X2P tablet (ums512_1h190, Unisoc T610 / UMS512 SharkL5Pro)"

[components]
# Minimal first-bring-up set, same shape as UniXNU-e5 (Unisoc UMS9621):
# device-tree platform expert + ARM CPU (GICv3 + architectural timer) + the
# payload/prelink tooling.  Storage, display and GPU components are added only
# after UART/framebuffer/DarwinBoot work on real hardware.
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "bbk-a2_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/ums512.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/bbk-a2.dts"
include_dirs = ["soc:dts"]

[firmware]
# uefi-bbk-a2 follows the Mu-Silicium repository layout that
# `./unixnu build firmware --uefi ../uefi-bbk-a2` and
# `./unixnu bootimg --uefi ../uefi-bbk-a2` expect:
#   BootShim/BootShim.S                 Unisoc cboot trampoline (0x80080000 -> FD_BASE)
#   Resources/Configs/bbk-a2.toml       [boot_shim] [uefi_fd] [boot_image_kernel] [boot_image]
#   Resources/Scripts/mkbootimg.py      Android boot image writer (from Mu-Silicium)
#   Platforms/Unisoc/bbkA2Pkg/          DSC/FDF + MemoryMapLib + UniXNU payload DXE
#   Silicon/Unisoc/UMS512Pkg/           SoC layer (UART, GIC, timer, DPU/GOP)
config = "bbk-a2"
dsc = "Platforms/Unisoc/bbkA2Pkg/bbkA2.dsc"
fd = "Build/bbkA2Pkg/{target}_CLANGDWARF/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Platforms/Unisoc",
  "{uefi}/Silicon/Unisoc",
  "{uefi}/Silicon/Silicium",
]

[firmware.defines]
DEVICE_MODEL = "bbk-a2"
ENABLE_SECUREBOOT = "0"

# Stock boot image parameters, read from the vendor boot.bin header:
#   header_version 2, pagesize 2048, kernel_addr 0x8000, ramdisk_addr 0x5400000
# plus the tags offset used by the EEBBK device tree (0x100).
# cboot relocates the kernel field to 0x80080000 regardless of kernel_addr;
# BootShim then copies the firmware volume to FD_BASE (0x80800000).
[bootimg.image]
base = 0x0
kernel_offset = 0x8000
ramdisk_offset = 0x5400000
tags_offset = 0x100
pagesize = 2048
header_version = 2

[payload]
# The boot partition is 35 MiB (0x2300000, measured from the whole-MiB dump
# length; the TWRP BoardConfig 40 MiB value carries a TODO and is wrong), so the
# FAT payload has to stay small for the first milestone.  Booting iOS needs the
# XNU kernel inside this volume; enlarge the boot partition (see
# docs/DUAL-BOOT.md) before that.
volume = "UNIXNU"
size_mib = 8
loader = "firmware"
title = "UniXNU BBK A2"
dram_size = "0x80000000"
panic_screen = false
timeout = 0
kernel_args = ["-v", "debug=0x144", "serial=3"]

[payload.adt]
# Format 2: the ADT is generated by scripts/make-adt.py from dts/bbk-a2.dts.
chip_id = "512"
unique_chip_id = "required"
dram_size = "0x80000000"
owned_memory_size = "0x10000000"
psci_method = "smc"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
